<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yo Claude</title>
<link rel="stylesheet" href="vendor/hl-dark.min.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="invaders.css">
<link rel="stylesheet" href="vendor/xterm.css">
</head>
<body>
<div id="app">
  <nav id="menubar">
    <button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="view">View</button>
    <button data-menu="session">Session</button><button data-menu="voice">Voice</button><button data-menu="tools">Tools</button>
    <button data-menu="options">Options</button><button data-menu="help">Help</button>
    <span class="spacer"></span>
    <span id="paneBtns" title="Which panes show beside the chat">
      <button id="sideBtn" class="panebtn" title="Sessions list (Ctrl+Shift+B)"><b>◧</b> sessions</button><button id="focusBtn" class="panebtn" title="Just the chat: hide both panes, or bring them back"><b>▣</b> focus</button><button id="chatBtn" class="panebtn on" title="Show or hide the chat"><b>▤</b> chat</button><button id="editorBtn" class="panebtn" title="Show or hide the file pane (files open here)"><b>▥</b> editor</button><button id="panelBtn" class="panebtn" title="Files, changes and git (Ctrl+B)"><b>◨</b> files</button>
    </span>
    <span id="limitsMeter" class="hidden"></span>
    <button id="updateBadge" class="hidden" title="A newer version is on GitHub: click to update"></button>
    <span id="versionTag" title="Yo Claude version (Help → About)"></span>
  </nav>
  <header id="top">
    <canvas id="logo" width="48" height="30" title="Talk to Claude"></canvas>
    <span class="brand">YO CLAUDE</span>
    <div id="folderBox" title="The folder this session works in. Select to copy, or paste/type a folder and press Enter.">
      <input id="folderPath" spellcheck="false" autocomplete="off" placeholder="chat (no folder) — paste a folder path + Enter">
      <button id="folderCopy" title="Copy the folder path">⧉</button>
      <button id="folderBtn" title="Start a session in another folder">▾</button>
    </div>
    <span id="modeBadge" class="badge chat">CHAT</span>
    <span id="branchPill" class="pill hidden"></span>
    <span class="spacer"></span>
    <span id="stateLabel" class="state"></span>
    <button id="tListen" class="toggle" title="Listen for “Yo Claude”">[mic]</button>
    <button id="tVoice" class="toggle" title="Read replies aloud">[voice]</button>
    <button id="awakeBtn" class="toggle" title="Keep the PC awake while Yo Claude runs">[staying awake]</button>
    <button id="tPc" class="toggle pc" title="Let Claude use your screen, keyboard and mouse. Adds ~11k tokens to every question, and screenshots add more.">[pc control]</button>
    <button id="compactBtn" title="Compact mode: hide this window, keep the bar">[compact]</button>
    <button id="helpBtn" title="How to use Yo Claude, and tune the wake word to your voice">[?]</button>
  </header>

  <aside id="side">
    <div class="sidehead">
      <div class="row">
        <button id="addFolderBtn" class="primary" title="Add a folder to work in">+ folder</button>
        <button id="newChatBtn" title="New chat without a folder">+ chat</button>
        <button id="newGroupBtn" title="A new group at the top of the list, to sort sessions from any folder into">+ group</button>
      </div>
      <input id="search" placeholder="search sessions…">
    </div>
    <div id="tree"></div>
    <div class="sidefoot">
      <button id="cleanBtn" title="Suggest stale conversations to move to the trash">clean up</button>
      <span class="spacer"></span>
      <button id="faceBtn" class="toggle" title="Show or hide the face (drag its top edge to resize it)">show Claude</button>
      <button id="trashBtn" title="Restore sessions you cleaned up or deleted">trash</button>
    </div>
  </aside>

  <div id="middle">
  <main id="chat">
    <div id="sessionHead">
      <span id="sessionTitle">new session</span>
      <span class="spacer"></span>
      <span id="ctxMeter" class="meter hidden"></span>
      <select id="modelSel" title="Model"></select>
      <select id="effortSel" title="Effort"></select>
      <select id="permSel" title="Permissions (code sessions)"></select>
    </div>
    <div id="extraDirs" class="hidden" title="Other folders this session may read and write, besides its own"></div>
    <div id="transcript"></div>
    <div id="planBox" class="hidden" title="Claude's plan for this task (click to fold)"></div>
    <div id="btw" class="hidden">
      <div class="btw-head"><b>btw</b><span class="dim">side chat, not added to the conversation</span><span class="spacer"></span><button id="btwClose" title="Close and discard the side chat (Esc)">[✕]</button></div>
      <div id="btwLog"></div>
      <input id="btwInput" placeholder="&gt; ask a side question…  (Enter asks · Esc closes)">
    </div>
    <div id="term" class="hidden">
      <div id="termGrip" title="Drag to resize · double-click to reset"></div>
      <div id="termHead">
        <span id="termTabs"></span>
        <button id="termNew" title="A new terminal in this session's folder">[+]</button>
        <span class="spacer"></span>
        <button id="termExt" title="The session's folder in a separate terminal window">[window]</button>
        <button id="termHide" title="Hide the terminal (Ctrl+`). Its shells keep running.">[✕]</button>
      </div>
      <div id="termBody"></div>
    </div>
    <div id="composer">
      <div id="chips"></div>
      <div id="atlist" class="menu hidden"></div>
      <div id="inputwrap">
        <textarea id="input" rows="2" placeholder="> message claude…  (Enter sends · Shift+Enter new line · @ attaches a file · / commands · paste images)"></textarea>
        <div id="ghost" aria-hidden="true"></div>
      </div>
      <div class="composer-actions">
        <button id="talkBtn" title="Talk instead of typing">[talk]</button>
        <button id="btwBtn" title="btw: ask a side question about this conversation without adding it to the conversation (or type /btw …)">[btw]</button>
        <button id="termBtn" title="Terminal (Ctrl+`)">[term]</button>
        <button id="invadersBtn" title="Bug Invaders: play while you wait (Esc hides it)">[👾]</button>
        <div id="inbar" class="minibar" title="What Yo Claude is doing">
          <canvas class="mb-m" width="40" height="26" title="Talk"></canvas>
          <canvas class="mb-meter" width="120" height="30"></canvas>
          <div class="mb-txt"><div class="mb-label"></div><div class="mb-text hidden"></div></div>
          <button class="mb-stop btn hidden" title="Stop (Esc)">[■]</button>
        </div>
        <button id="sendBtn" class="primary">[send ⏎]</button>
      </div>
    </div>
  </main>
  <div id="docsGrip" title="Drag to resize · double-click to reset"></div>
  <section id="docs">
    <div id="docsTabs"></div>
    <div id="docsPath" class="hidden"></div>
    <div id="docsBar"></div>
    <div id="docsBody"><div id="docsEmpty">No file open. Click a file in the files tab, or a file path in the chat.</div></div>
  </section>
  </div>

  <aside id="panel"></aside>
</div>
<div id="menu" class="menu hidden"></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="vendor/xterm-addon-web-links.js"></script>
<script src="name.js"></script>
<script src="mascot.js"></script>
<script src="minibar.js"></script>
<script src="follow.js"></script>
<script src="app.js"></script>
<script src="player.js"></script>
<script src="codeview.js"></script>
<script src="textview.js"></script>
<script src="panel.js"></script>
<script src="gallery.js"></script>
<script src="terminal.js"></script>
<script src="docs.js"></script>
<script src="tasks.js"></script>
<script src="plan.js"></script>
<script src="btw.js"></script>
<script src="avatar.js"></script>
<script src="training.js"></script>
<script src="menus.js"></script>
<script src="models.js"></script>
<script src="meters.js"></script>
<script src="resize.js"></script>
<script src="invaders.js"></script>
</body>
</html>
