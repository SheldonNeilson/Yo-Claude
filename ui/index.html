<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yo Claude</title>
<link rel="stylesheet" href="vendor/hl-dark.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav id="menubar">
    <button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="view">View</button>
    <button data-menu="session">Session</button><button data-menu="voice">Voice</button><button data-menu="tools">Tools</button>
    <button data-menu="help">Help</button>
    <span class="spacer"></span>
    <button id="updateBadge" class="hidden" title="A newer version is on GitHub: click to update"></button>
    <span id="versionTag" title="Yo Claude version (Help → About)"></span>
  </nav>
  <header id="top">
    <canvas id="logo" width="48" height="30" title="Talk to Claude"></canvas>
    <span class="brand">YO CLAUDE</span>
    <div id="folderBox" title="The folder this session works in. Select to copy, or paste/type a folder and press Enter.">
      <input id="folderPath" spellcheck="false" autocomplete="off" placeholder="chat (no folder) — paste a folder path + Enter">
      <button id="folderCopy" title="Copy the folder path">⧉</button>
      <button id="folderBtn" title="Start a session in another folder">▾</button>
    </div>
    <span id="modeBadge" class="badge chat">CHAT</span>
    <span id="branchPill" class="pill hidden"></span>
    <span class="spacer"></span>
    <span id="stateLabel" class="state"></span>
    <button id="tListen" class="toggle" title="Listen for “Yo Claude”">[mic]</button>
    <button id="tVoice" class="toggle" title="Read replies aloud">[voice]</button>
    <button id="tPc" class="toggle pc" title="Let Claude use your screen, keyboard and mouse. Adds ~11k tokens to every question, and screenshots add more.">[pc control]</button>
    <button id="panelBtn" title="Files, changes and git">[files]</button>
    <button id="compactBtn" title="Compact mode: hide this window, keep the bar">[compact]</button>
    <button id="helpBtn" title="How to use Yo Claude, and tune the wake word to your voice">[?]</button>
  </header>

  <aside id="side">
    <div class="sidehead">
      <div class="row">
        <button id="addFolderBtn" class="primary" title="Add a folder to work in">+ folder</button>
        <button id="newChatBtn" title="New chat without a folder">+ chat</button>
      </div>
      <input id="search" placeholder="search sessions…">
    </div>
    <div id="tree"></div>
    <div class="sidefoot">
      <button id="cleanBtn" title="Suggest stale conversations to move to the trash">clean up</button>
      <span class="spacer"></span>
      <button id="trashBtn" title="Restore sessions you cleaned up or deleted">trash</button>
    </div>
  </aside>

  <main id="chat">
    <div id="sessionHead">
      <span id="sessionTitle">new session</span>
      <span class="spacer"></span>
      <select id="modelSel" title="Model"></select>
      <select id="effortSel" title="Effort"></select>
      <select id="permSel" title="Permissions (code sessions)"></select>
    </div>
    <div id="extraDirs" class="hidden" title="Other folders this session may read and write, besides its own"></div>
    <div id="transcript"></div>
    <div id="composer">
      <div id="chips"></div>
      <div id="atlist" class="menu hidden"></div>
      <textarea id="input" rows="2" placeholder="> message claude…  (Enter sends · Shift+Enter new line · @ attaches a file · paste images)"></textarea>
      <div class="composer-actions">
        <button id="talkBtn" title="Talk instead of typing">[talk]</button>
        <div id="inbar" class="minibar" title="What Yo Claude is doing">
          <canvas class="mb-m" width="40" height="26" title="Talk"></canvas>
          <canvas class="mb-meter" width="120" height="30"></canvas>
          <div class="mb-txt"><div class="mb-label"></div><div class="mb-text hidden"></div></div>
          <button class="mb-stop btn hidden" title="Stop (Esc)">[■]</button>
        </div>
        <button id="sendBtn" class="primary">[send ⏎]</button>
      </div>
    </div>
  </main>

  <aside id="panel"></aside>
</div>
<div id="menu" class="menu hidden"></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="mascot.js"></script>
<script src="minibar.js"></script>
<script src="app.js"></script>
<script src="panel.js"></script>
<script src="training.js"></script>
<script src="menus.js"></script>
</body>
</html>
