<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yo Claude bar</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { background: var(--bg); overflow: hidden; }
  #bar { min-height: 56px; padding: 6px 12px; border: 2px solid var(--line2); box-sizing: border-box; width: 100vw; }
  #bar .mb-text { -webkit-line-clamp: 6; max-height: 120px; }
</style>
</head>
<body>
<div id="bar" class="minibar pywebview-drag-region">
  <canvas class="mb-m" width="48" height="30" title="Talk"></canvas>
  <canvas class="mb-meter" width="120" height="36"></canvas>
  <div class="mb-txt"><div class="mb-label"></div><div class="mb-text hidden"></div></div>
  <button class="mb-stop btn hidden" title="Stop">[■]</button>
  <button id="open" class="btn" title="Open the full window (the bar moves into it)">[⤢]</button>
  <button id="min" class="btn" title="Hide until next time">[_]</button>
</div>
<script src="mascot.js"></script>
<script src="minibar.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const api = () => window.pywebview.api;
let lastH = 0;
const bar = new MiniBar($("#bar"), {
  onLayout() {
    const h = Math.ceil($("#bar").getBoundingClientRect().height);
    if (Math.abs(h - lastH) > 2) { lastH = h; api().bar_resize(h); }
  },
});
window.app = { events(list) { for (const e of list) bar.event(e); } };
$("#open").onclick = () => api().open_main();
$("#min").onclick = () => api().bar_minimise();
window.addEventListener("pywebviewready", async () => {
  const s = await api().init();
  bar.event({ kind: "display", ...s.display });
});
</script>
</body>
</html>
